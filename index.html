<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<style>

*{box-sizing:border-box;margin:0;font-family:Cairo,Tahoma,sans-serif}
body{background:radial-gradient(ellipse at top,#0a1f6b,var(--bg) 60%);color:var(--tx);min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}

.o2{width:380px;height:380px;background:var(--b3);bottom:-120px;left:-80px;animation-delay:-5s}

.logo{font-weight:900;font-size:1.5rem;background:linear-gradient(90deg,#fff,var(--b3));-webkit-background-clip:text;color:transparent;display:flex;gap:8px;align-items:center;cursor:pointer}
.logo i{font-style:normal;animation:bob 2.5s infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-8deg)}}
.btn{border:0;cursor:pointer;color:#fff;font-weight:800;font-size:1rem;padding:11px 26px;border-radius:14px;background:linear-gradient(135deg,var(--b1),var(--b2) 60%,var(--b3));box-shadow:0 8px 25px rgba(30,144,255,.45);transition:.25s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 14px 35px rgba(0,212,255,.55)}
.btn:after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sh 3s infinite}
@keyframes sh{to{left:160%}}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none}.btn.red{background:linear-gradient(135deg,#c0152f,#ff4d6d)}

@keyframes up{from{opacity:0;transform:translateY(40px)}}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;backdrop-filter:blur(12px);transition:.35s;animation:up .7s both;position:relative;overflow:hidden}
.card:hover{transform:translateY(-8px) rotateX(3deg);border-color:var(--b3);box-shadow:0 20px 50px rgba(0,120,255,.35)}
.grade{text-align:center;cursor:pointer}.grade .ic{font-size:2.6rem;display:block;margin-bottom:10px;animation:bob 3s infinite}
.grade h3{font-size:1.15rem}.grade small{opacity:.7}
.wrap{max-width:1000px;margin:30px auto;padding:0 5%}
h2{font-weight:900;margin-bottom:16px}
input,select,textarea{width:100%;padding:13px 16px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font-size:1rem;outline:0;margin-bottom:12px;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--b3);box-shadow:0 0 0 3px rgba(0,212,255,.25)}
option{color:#000}::placeholder{color:#9db6e6}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.75);backdrop-filter:blur(6px);display:none;place-items:center;z-index:20;padding:16px}
.modal.on{display:grid}.box{width:100%;max-width:440px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}
.err{color:#ff8fa3;min-height:22px;font-weight:600;margin-bottom:6px}
.lock{text-align:center;padding:40px 24px}
.lock .big{font-size:4.5rem;animation:shake 2.5s infinite}
@keyframes shake{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-14deg)}90%{transform:rotate(14deg)}95%{transform:rotate(-8deg)}}

.item div.m{flex:1}.item small{opacity:.75}
.wa{background:linear-gradient(135deg,#128c4a,#25d366);box-shadow:0 8px 25px rgba(37,211,102,.4)}
video,iframe.v{width:100%;aspect-ratio:16/9;border-radius:16px;border:0;background:#000;margin-top:10px}

.stats .card{text-align:center;padding:16px}.stats b{font-size:2rem;color:var(--b3);display:block}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:right}

.notice{background:linear-gradient(90deg,#0b3dff55,#00d4ff33);border:1px solid var(--line);padding:10px;text-align:center;font-weight:700;position:relative;z-index:2}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}

.pic .ring{position:relative;width:clamp(190px,34vw,260px);aspect-ratio:1;border-radius:50%;padding:6px;background:conic-gradient(from 0deg,var(--b1),var(--b3),#6aa8ff,var(--b2),var(--b1));box-shadow:0 0 50px rgba(0,212,255,.45),0 20px 60px rgba(11,61,255,.45);animation:spin 8s linear infinite}
.pic .ring:before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px dashed var(--line)}
.pic img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:5px solid var(--bg);animation:unspin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes unspin{to{transform:rotate(-360deg)}}

.chap{margin-bottom:26px}.chh{display:flex;gap:12px;align-items:center;margin:18px 0 12px;padding:12px 16px;border-radius:16px;background:linear-gradient(90deg,#0b3dff44,transparent);border:1px solid var(--line)}.chh>span{font-size:1.8rem}.chh h3{font-weight:900}.chh small{opacity:.75}
.lock.mini{padding:20px;margin-bottom:14px}.gh{margin:18px 0 10px;font-weight:900}
.chrow{cursor:pointer;padding:12px;border:1px solid var(--line);border-radius:16px;transition:.25s;background:rgba(255,255,255,.04)}.chrow{flex-wrap:wrap}.chrow .m{min-width:150px}.chrow .acts{display:flex;gap:6px;flex-wrap:wrap}.chrow .acts .btn{padding:7px 12px}.chrow:hover{border-color:var(--b3);transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,120,255,.3)}
.codebox{font-family:'Courier New',monospace;font-weight:900;font-size:clamp(1.8rem,8vw,2.6rem);letter-spacing:5px;padding:20px 10px;margin:14px 0;border-radius:18px;background:rgba(0,0,0,.35);border:1px dashed var(--b3);color:var(--b3);text-shadow:0 0 18px rgba(0,212,255,.7);user-select:all;direction:ltr}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--b1),var(--b3));transition:width 1s linear}
</style>
</head>

<script>const ADMIN={"email": "ahamed@gmail.com", "pass": "caea07302c991f046d7db766:010a67617d2a954aedc523341ed9cc431f601c8dab5b180d918e527f38922514"};</script>
<script>

   if(b.id){const c=db.chapters.find(x=>x.id===b.id);if(!c)E('الفصل غير موجود',404);c.title=t;save();return c}
   if(!GRADES.includes(b.grade))E('اختر الصف',400);const c={id:rnd(),grade:b.grade,title:t,ts:Date.now()};db.chapters.push(c);save();return c}
  if(p.startsWith('/api/admin/chapters/')&&m==='DELETE'){const id=p.split('/').pop();
   for(const it of db.content.filter(c=>c.ch===id))if(it.file)await idbOp('delete',it.file);
   db.content=db.content.filter(c=>c.ch!==id);db.chapters=db.chapters.filter(c=>c.id!==id);for(const k in issued)if(issued[k].ch===id)delete issued[k];saveIss();save();return{ok:1}}
  if(p==='/api/admin/chcode'&&m==='POST'){
   const ch=db.chapters.find(x=>x.id===b.chapter);if(!ch)E('الفصل غير موجود',404);
   if(b.prev){const pn=cn(b.prev);if(issued[pn]&&!issued[pn].sent&&!used[pn]){delete issued[pn];saveIss()}}
   if(b.drop)return{ok:1};
   const n=await pickCls();
   if(n<0)E('خلصت أكواد الفصول',409);
   issued[n]={ch:ch.id,t:Date.now(),sent:0};saveIss();return{code:fmt(n)}}
  if(p==='/api/admin/chsent'&&m==='POST'){const n=cn(b.code);if(issued[n]){issued[n].sent=1;saveIss()}return{ok:1}}
  if(p==='/api/admin/content'&&m==='POST'){
   if(!GRADES.includes(b.grade)||!String(b.title||'').trim())E('بيانات ناقصة',400);
   const ch=String(b.ch||''),chp=ch&&db.chapters.find(x=>x.id===ch);if(ch&&(!chp||chp.grade!==b.grade))E('الفصل مش تابع للصف ده',400);
   const it={id:b.id||rnd(),grade:b.grade,ch,type:['video','exam','file'].includes(b.type)?b.type:'video',title:String(b.title).slice(0,120),desc:String(b.desc||'').slice(0,400),url:String(b.url||'').slice(0,500),file:String(b.file||'').replace(/[^\w.\-]/g,''),ts:Date.now()};
   const i=db.content.findIndex(c=>c.id===it.id);i<0?db.content.push(it):db.content[i]={...db.content[i],...it};save();return it}
  if(p.startsWith('/api/admin/content/')&&m==='DELETE'){const id=p.split('/').pop(),it=db.content.find(c=>c.id===id);if(it&&it.file)await idbOp('delete',it.file);db.content=db.content.filter(c=>c.id!==id);save();return{ok:1}}
  if(p==='/api/admin/upload'){
   const f=o.body,ext=((o.headers||{})['x-filename']||'').toLowerCase().match(/\.[a-z0-9]+$/)?.[0];
   if(!['.pdf','.mp4','.png','.jpg','.jpeg','.docx'].includes(ext))E('نوع الملف غير مدعوم',400);
   const name=rnd().slice(0,16)+ext;await idbOp('put',f,name);return{file:name}}
  if(p==='/api/admin/settings'&&m==='PUT'){db.settings={name:String(b.name||'').slice(0,50)||db.settings.name,whatsapp:String(b.whatsapp||'').slice(0,15)||db.settings.whatsapp,notice:String(b.notice||'').slice(0,300)};
   if(String(b.pass||'').length>=6)me.pass=hash(b.pass);save();return db.settings}}
 E('غير موجود',404)};

  <div style="max-width:320px;margin:24px auto 0"><input id="code" dir="ltr" style="text-align:center;letter-spacing:3px" placeholder="XXXX-XXXX"><button class="btn" onclick="useCode('/api/activate')">تفعيل الحساب</button></div></div></div>`;return}

 const ico={video:'🎬',exam:'📝',file:'📄'},chs=c.chapters||[],ids=new Set(chs.map(x=>x.id)),gen=c.items.filter(x=>!x.ch||!ids.has(x.ch));
 const itemH=(it,i)=>`<div class="card item ${it.o?'':'locked'}" style="animation-delay:${i*.06}s"><div class="t">${it.o?ico[it.type]:'🔒'}</div><div class="m"><b>${esc(it.title)}</b><br><small>${esc(it.desc)}</small><div id="p${it.id}"></div></div>${it.o?`<button class="btn sm" onclick='openItem(${JSON.stringify(it).replace(/'/g,"&#39;")})'>${it.type=='video'?'مشاهدة':'فتح'}</button>`:''}</div>`;
 const chH=ch=>{const its=c.items.filter(x=>x.ch===ch.id);return `<div class="chap"><div class="chh"><span>${ch.open?'📂':'🔒'}</span><div><h3>${esc(ch.title)}</h3><small>${its.length} عنصر${ch.open?' • مفتوح ✅':''}</small></div></div>
 ${ch.open?'':`<div class="card lock mini"><p style="opacity:.85;margin-bottom:12px">الفصل ده مغلق. ابعت على <b dir="ltr">${S.settings.whatsapp}</b> علشان تاخد <b>كود الفصل</b>.</p><a href="${waLink('السلام عليكم، أنا '+u.name+' عايز كود '+ch.title+' - '+G[u.grade][0])}" target="_blank"><button class="btn wa sm">📲 ابعت على واتساب</button></a><div class="row" style="margin-top:14px"><input id="code_${ch.id}" dir="ltr" style="text-align:center;letter-spacing:3px;margin:0" placeholder="XXXX-XXXX"><button class="btn sm" style="flex:none" onclick="useCode('/api/unlock','${ch.id}')">فتح الفصل</button></div></div>`}
 ${its.length?its.map(itemH).join(''):'<div class="card" style="text-align:center;opacity:.8">لسه مفيش محتوى في الفصل ده</div>'}</div>`};
 const oldLock=`<div class="card lock" style="margin-bottom:20px"><div class="big">🔐</div><h2>الفيديوهات والاختبارات مغلقة</h2><p style="opacity:.85;margin-bottom:14px">ابعت على <b dir="ltr">${S.settings.whatsapp}</b> علشان تاخد <b>كود الفصل</b> وافتح كل المحتوى.</p>

 <div style="max-width:320px;margin:20px auto 0"><input id="code" dir="ltr" style="text-align:center;letter-spacing:3px" placeholder="كود الفصل"><button class="btn" onclick="useCode('/api/unlock')">فتح المحتوى</button></div></div>`;
 $('app').innerHTML=`<div class="wrap"><h2>أهلاً ${esc(u.name.split(' ')[0])} 👋 — ${G[u.grade][0]}</h2>
 ${chs.map(chH).join('')}
 ${gen.length?`${chs.length?'<h3 class="gh">📌 محتوى عام</h3>':''}${c.open?'':oldLock}${gen.map(itemH).join('')}`:''}

function embed(u){let m=u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);return m?`https://www.youtube-nocookie.com/embed/${m[1]}`:null}
async function openItem(it){const h=$('p'+it.id);if(h.innerHTML){h.innerHTML='';return}let src;try{src=it.file?await fileUrl(it.file):it.url}catch(e){return toast(e.message)}
 if(it.type=='video'){const e=embed(src);h.innerHTML=e?`<iframe class="v" src="${e}" allowfullscreen></iframe>`:`<video src="${esc(src)}" controls controlsList="nodownload"></video>`}
 else window.open(src,'_blank')}

 window.CL=[];for(const g of Object.keys(G)){const r=await api('/api/content?grade='+g);CL.push(...r.items)}
 fillCh();$('chlist').innerHTML=chHtml();
 $('clist').innerHTML=CL.length?CL.map(i=>`<div class="item"><div class="m"><b>${esc(i.title)}</b> <small>— ${G[i.grade][0]} • ${i.type}${i.ch?' • 📂 '+esc(CH.find(c=>c.id===i.ch)?.title||''):''}</small></div><button class="btn sm ghost" onclick="editC('${i.id}')">تعديل</button> <button class="btn sm red" onclick="delC('${i.id}')">حذف</button></div>`).join(''):'لا يوجد محتوى بعد'}
function editC(id){const i=CL.find(x=>x.id==id);$('cid').value=i.id;$('cg').value=i.grade;fillCh(i.ch);$('ct').value=i.type;$('cti').value=i.title;$('cd').value=i.desc||'';$('cu').value=i.url||'';scrollTo({top:0,behavior:'smooth'})}
async function delC(id){if(!confirm('متأكد من الحذف؟'))return;await api('/api/admin/content/'+id,{method:'DELETE'});admin()}
async function saveContent(){try{let file='';const f=$('cf').files[0];
 if(f){toast('جاري الرفع...');file=(await api('/api/admin/upload',{method:'POST',headers:{'x-filename':f.name},body:f})).file}
 const old=CL.find(x=>x.id==$('cid').value);
 await post('/api/admin/content',{id:$('cid').value||undefined,grade:$('cg').value,ch:$('cch').value,type:$('ct').value,title:$('cti').value,desc:$('cd').value,url:$('cu').value,file:file||old?.file||''});toast('تم الحفظ ✅');admin()}catch(e){toast(e.message)}}
async function saveSet(){$('sp').value='';S.settings=await post('/api/admin/settings',{name:$('sn').value,whatsapp:$('sw').value,notice:$('sno').value,pass:$('sp').value},'PUT');nav();toast('تم الحفظ ✅')}
// ---------- الفصول وأكوادها
const ROT=60;let CM=null;
function fillCh(sel){const e=$('cch');if(!e)return;e.innerHTML='<option value="">بدون فصل (محتوى عام)</option>'+CH.filter(c=>c.grade===$('cg').value).map(c=>`<option value="${c.id}">📂 ${esc(c.title)}</option>`).join('');if(sel)e.value=sel}
function chHtml(){return Object.entries(G).map(([g,v])=>{const l=CH.filter(c=>c.grade===g);if(!l.length)return'';
 return `<h3 style="margin:14px 0 8px">${v[1]} ${v[0]}</h3>`+l.map(c=>{const its=CL.filter(i=>i.ch===c.id),n=t=>its.filter(i=>i.type===t).length;
 return `<div class="item chrow" onclick="openCode('${c.id}')"><div class="t">📂</div><div class="m"><b>${esc(c.title)}</b> <small>— 🎬 ${n('video')} • 📝 ${n('exam')} • 📄 ${n('file')}</small><br><small>اضغط لعرض كود الفصل 🔑</small></div><div class="acts"><button class="btn sm" onclick="event.stopPropagation();addTo('${c.id}')">➕ محتوى</button><button class="btn sm ghost" onclick="event.stopPropagation();renCh('${c.id}')">تعديل</button><button class="btn sm red" onclick="event.stopPropagation();delCh('${c.id}')">حذف</button></div></div>`}).join('')}).join('')||'لا توجد فصول بعد'}
async function addCh(){try{await post('/api/admin/chapters',{grade:$('chg').value,title:$('cht').value});toast('تمت إضافة الفصل ✅');admin()}catch(e){toast(e.message)}}
async function renCh(id){const c=CH.find(x=>x.id==id),t=prompt('اسم الفصل الجديد',c.title);if(!t)return;try{await post('/api/admin/chapters',{id,title:t});toast('تم التعديل ✅');admin()}catch(e){toast(e.message)}}
async function delCh(id){if(!confirm('حذف الفصل وكل الفيديوهات والاختبارات اللي جواه؟'))return;await api('/api/admin/chapters/'+id,{method:'DELETE'});toast('تم الحذف');admin()}
function addTo(id){const c=CH.find(x=>x.id==id);$('cid').value='';$('cg').value=c.grade;fillCh(id);$('cform').scrollIntoView({behavior:'smooth'});$('cti').focus()}
function scr(final){const el=$('cmc');if(!el)return;let n=0;const iv=setInterval(()=>{n++;if(n>10||!$('cmc')){clearInterval(iv);if($('cmc'))$('cmc').textContent=final;return}el.textContent=Array.from(final,ch=>ch=='-'?'-':AL[Math.random()*32|0]).join('')},50)}
async function newCode(){if(!CM||CM.busy)return;CM.busy=1;try{const r=await post('/api/admin/chcode',{chapter:CM.id,prev:CM.sent?null:CM.code});CM.code=r.code;CM.sent=false;CM.t=ROT;scr(r.code);tick(true)}catch(e){toast(e.message)}if(CM)CM.busy=0}
function tick(nt){if(!CM)return;if(nt!==true)CM.t--;const b=$('cmb'),l=$('cml');if(b)b.style.width=Math.max(0,CM.t/ROT*100)+'%';if(l)l.textContent='يتغير بعد '+Math.max(0,CM.t)+' ث';if(CM.t<=0)newCode()}
async function openCode(id){if(CM)closeCode();const c=CH.find(x=>x.id==id);CM={id,code:'',sent:false,t:ROT,title:c.title,grade:G[c.grade][0]};
 document.body.insertAdjacentHTML('beforeend',`<div class="modal on" id="cm" onclick="if(event.target===this)closeCode()"><div class="card box" style="text-align:center"><small style="opacity:.75">${G[c.grade][0]}</small><h2 style="margin:4px 0 0">📂 ${esc(c.title)}</h2><div class="codebox" id="cmc">••••-••••</div><div class="bar"><i id="cmb"></i></div><small id="cml"></small>
 <div class="row" style="margin-top:16px"><button class="btn sm" onclick="copyCode()">📋 نسخ</button><button class="btn sm wa" onclick="sendCode()">📲 واتساب</button></div>
 <div class="row" style="margin-top:10px"><button class="btn sm ghost" onclick="newCode()">🔄 كود جديد</button><button class="btn sm ghost" onclick="closeCode()">إغلاق</button></div>
 <p style="opacity:.7;font-size:.8rem;margin-top:14px">الكود بيتغير لوحده عشوائي. الكود اللي تنسخه أو تبعته بيفضل شغال لحد ما الطالب يستخدمه (مرة واحدة وللفصل ده بس).</p></div></div>`);
 await newCode();CM&&(CM.iv=setInterval(tick,1000))}
function closeCode(){if(!CM)return;clearInterval(CM.iv);const m=CM;CM=null;$('cm')?.remove();if(m.code&&!m.sent)post('/api/admin/chcode',{chapter:m.id,prev:m.code,drop:1}).catch(()=>{})}
async function markSent(){if(!CM||!CM.code)return;CM.sent=true;try{await post('/api/admin/chsent',{code:CM.code})}catch{}}
async function copyCode(){if(!CM||!CM.code)return;const c=CM.code;try{await navigator.clipboard.writeText(c)}catch{const t=document.createElement('textarea');t.value=c;document.body.append(t);t.select();document.execCommand('copy');t.remove()}toast('تم نسخ الكود 📋');markSent()}
function sendCode(){if(!CM||!CM.code)return;window.open('https://wa.me/?text='+encodeURIComponent(`كود فتح فصل "${CM.title}" (${CM.grade}):\n${CM.code}\nالكود يُستخدم مرة واحدة فقط.`),'_blank');markSent()}
// ---------- خلفية جزيئات متحركة
(()=>{const c=$('bg'),x=c.getContext('2d');let w,h,P=[];const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight;P=Array.from({length:Math.min(70,w/18|0)},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6}))};rs();addEventListener('resize',rs);
 (function f(){x.clearRect(0,0,w,h);P.forEach((a,i)=>{a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>w)a.vx*=-1;if(a.y<0||a.y>h)a.vy*=-1;x.fillStyle='#4cc3ff';x.beginPath();x.arc(a.x,a.y,2,0,7);x.fill();for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){x.strokeStyle=`rgba(76,195,255,${.25*(1-d/120)})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}});requestAnimationFrame(f)})()})();
(async()=>{try{const r=await api('/api/me');S.user=r.user;S.settings=r.settings}catch{}nav();S.user?go(S.user.role=='admin'?'admin':'dash'):home()})();
</script>
</body>
</html>
